<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
  <defs>
    <linearGradient id="bgHeroArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e35" />
      <stop offset="60%" stop-color="#17191C" />
      <stop offset="100%" stop-color="#0f1114" />
    </linearGradient>
    <linearGradient id="yellowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe169" />
      <stop offset="100%" stop-color="#ff9e00" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF3124" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="720" height="320" rx="24" fill="url(#bgHeroArt)"/>

  <!-- Blueprint isometric grid pattern -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="0" y1="80" x2="720" y2="80"/>
    <line x1="0" y1="160" x2="720" y2="160"/>
    <line x1="0" y1="240" x2="720" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <!-- Isometric diagonals -->
    <line x1="0" y1="180" x2="360" y2="0"/>
    <line x1="360" y1="320" x2="720" y2="140"/>
    <line x1="0" y1="40" x2="560" y2="320"/>
  </g>

  <!-- Right side: Gennadiy 3D-styled Mascot Illustration -->
  <g transform="translate(450, 20)">
    <!-- Ambient orange glow behind Gennadiy -->
    <circle cx="120" cy="140" r="110" fill="#EF3124" opacity="0.25" filter="url(#glow)"/>
    <circle cx="130" cy="130" r="70" fill="#ffd166" opacity="0.2" filter="url(#glow)"/>

    <!-- Sparks and flying debris -->
    <path d="M40 80 L52 70 L48 84 L64 74 L50 92 Z" fill="#ffd166"/>
    <path d="M220 110 L235 95 L228 115 L245 105 L230 125 Z" fill="#ffd166"/>
    <polygon points="35,160 45,150 40,165" fill="#f4f1ea" opacity="0.7"/>
    <polygon points="210,180 220,170 216,185" fill="#f4f1ea" opacity="0.7"/>

    <!-- Gennadiy Character Body -->
    <!-- Torso (Striped Telnyashka) -->
    <path d="M70 150 C70 120 170 120 170 150 L180 250 C180 270 60 270 60 250 Z" fill="#ffffff" stroke="#17191C" stroke-width="4"/>
    <!-- Blue stripes -->
    <g fill="#1d4ed8">
      <rect x="68" y="145" width="104" height="12" rx="4"/>
      <rect x="65" y="168" width="110" height="12" rx="4"/>
      <rect x="63" y="191" width="114" height="12" rx="4"/>
      <rect x="62" y="214" width="116" height="12" rx="4"/>
      <rect x="61" y="237" width="118" height="12" rx="4"/>
    </g>

    <!-- Head & Neck -->
    <rect x="105" y="110" width="30" height="25" rx="5" fill="#f5c296"/>
    <ellipse cx="120" cy="90" rx="36" ry="40" fill="#f5c296" stroke="#17191C" stroke-width="4"/>

    <!-- Big Nose -->
    <ellipse cx="120" cy="92" rx="12" ry="15" fill="#e79f6d" stroke="#17191C" stroke-width="3"/>

    <!-- Eyes (mischievous squint) -->
    <ellipse cx="104" cy="78" rx="7" ry="9" fill="#ffffff" stroke="#17191C" stroke-width="2.5"/>
    <circle cx="106" cy="78" r="4" fill="#17191C"/>
    <circle cx="108" cy="76" r="1.5" fill="#ffffff"/>

    <ellipse cx="136" cy="78" rx="7" ry="9" fill="#ffffff" stroke="#17191C" stroke-width="2.5"/>
    <circle cx="134" cy="78" r="4" fill="#17191C"/>
    <circle cx="136" cy="76" r="1.5" fill="#ffffff"/>

    <!-- Bushy Mustache -->
    <path d="M90 102 C105 92 115 106 120 100 C125 106 135 92 150 102 C145 116 125 120 120 108 C115 120 95 116 90 102 Z" fill="#58311a" stroke="#17191C" stroke-width="3.5"/>

    <!-- Orange Safety Hard Hat with Headlamp -->
    <path d="M80 64 C80 26 160 26 160 64 Z" fill="#f77f00" stroke="#17191C" stroke-width="4"/>
    <path d="M72 64 L168 64" stroke="#17191C" stroke-width="6" stroke-linecap="round"/>
    <!-- Headlamp -->
    <rect x="110" y="44" width="20" height="15" rx="3" fill="#17191C"/>
    <ellipse cx="120" cy="51" rx="8" ry="6" fill="#ffff55"/>
    <!-- Light cone from lamp -->
    <polygon points="120,51 20,0 20,80" fill="#ffff77" opacity="0.15"/>

    <!-- Makita Hammer Drill in hand -->
    <g transform="translate(140, 140) rotate(15)">
      <rect x="0" y="20" width="70" height="34" rx="6" fill="#008882" stroke="#17191C" stroke-width="3.5"/>
      <rect x="65" y="24" width="24" height="26" rx="4" fill="#22262c" stroke="#17191C" stroke-width="3"/>
      <!-- Drill bit -->
      <rect x="89" y="32" width="45" height="10" fill="#b9bec4" stroke="#17191C" stroke-width="2.5"/>
      <line x1="93" y1="32" x2="98" y2="42" stroke="#717a84" stroke-width="2"/>
      <line x1="102" y1="32" x2="107" y2="42" stroke="#717a84" stroke-width="2"/>
      <line x1="111" y1="32" x2="116" y2="42" stroke="#717a84" stroke-width="2"/>
      <!-- Lightning burst on drill tip -->
      <path d="M135 37 L150 25 L145 37 L160 30 L148 45 L153 38 Z" fill="#ffd100" stroke="#ff9e00" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Left side: Text & Co-branding Badge -->
  <g transform="translate(48, 50)">
    <!-- Alfa badge -->
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#ffffff"/>
    <circle cx="18" cy="18" r="8" fill="#EF3124"/>
    <text x="36" y="23" fill="#17191C" font-family="'Manrope', sans-serif" font-weight="800" font-size="12" letter-spacing="1">
      АЛЬФАСТРАХОВАНИЕ
    </text>
    <rect x="180" y="8" width="88" height="20" rx="10" fill="#EF3124"/>
    <text x="224" y="22" text-anchor="middle" fill="#ffffff" font-family="'Manrope', sans-serif" font-weight="900" font-size="10" letter-spacing="1">
      СПЕЦПРОЕКТ
    </text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-family="'Unbounded', sans-serif" font-weight="900" font-size="34" letter-spacing="0.5">
      ГЕНАСТРОФА
    </text>
    <text x="0" y="122" fill="#EF3124" font-family="'Unbounded', sans-serif" font-weight="800" font-size="20" letter-spacing="0.5">
      СИМУЛЯТОР СОСЕДА СВЕРХУ
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#c3c7ce" font-family="'Manrope', sans-serif" font-weight="600" font-size="14">
      60 секунд чистого куража с перфоратором «Макита-Ультра».
    </text>
    <text x="0" y="190" fill="#c3c7ce" font-family="'Manrope', sans-serif" font-weight="600" font-size="14">
      Разнесите квартиру в щепки — или проверьте силу полиса!
    </text>

    <!-- Stat Pill -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="170" height="32" rx="10" fill="rgba(255,255,255,0.1)"/>
      <text x="14" y="21" fill="#4cc9f0" font-family="'Manrope', sans-serif" font-weight="800" font-size="12">
        ● 14 составных 3D-моделей
      </text>
      <rect x="185" y="0" width="160" height="32" rx="10" fill="rgba(255,255,255,0.1)"/>
      <text x="199" y="21" fill="#ffd166" font-family="'Manrope', sans-serif" font-weight="800" font-size="12">
        ⚡️ Цепные комбо стихий
      </text>
    </g>
  </g>
</svg>
