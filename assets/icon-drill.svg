<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgDrill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#EF3124" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="url(#bgDrill)" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-dasharray="4 3"/>
  <!-- Sparks -->
  <path d="M78 30 L84 22 L86 29 L96 20 L89 34 Z" fill="#ffd23f" />
  <path d="M92 48 L104 46 L95 53 L102 62 L88 56 Z" fill="#ffd23f" />
  <circle cx="98" cy="34" r="2.5" fill="#ffffff"/>
  <circle cx="82" cy="18" r="2" fill="#ffd23f"/>
  <circle cx="106" cy="58" r="1.5" fill="#ffffff"/>
  <!-- Hammer Drill body -->
  <g transform="translate(18, 30) rotate(-22 45 35)">
    <!-- Main motor housing -->
    <rect x="25" y="16" width="36" height="24" rx="4" fill="#008882" stroke="#17191C" stroke-width="2.5"/>
    <!-- Vents -->
    <line x1="30" y1="22" x2="42" y2="22" stroke="#17191C" stroke-width="2"/>
    <line x1="30" y1="26" x2="42" y2="26" stroke="#17191C" stroke-width="2"/>
    <line x1="30" y1="30" x2="42" y2="30" stroke="#17191C" stroke-width="2"/>
    <!-- Gear housing (black) -->
    <rect x="58" y="18" width="14" height="20" rx="3" fill="#22262c" stroke="#17191C" stroke-width="2.5"/>
    <!-- Chuck (SDS-plus) -->
    <rect x="70" y="22" width="10" height="12" rx="2" fill="#17191C"/>
    <!-- Drill Bit -->
    <rect x="80" y="25" width="22" height="6" fill="#b9bec4" stroke="#17191C" stroke-width="1.5"/>
    <path d="M82 25 L86 31 M88 25 L92 31 M94 25 L98 31" stroke="#889098" stroke-width="1.5"/>
    <!-- Main Handle (D-shape) -->
    <path d="M26 24 C14 24 12 48 24 50 L26 42 C20 40 20 30 26 28 Z" fill="#22262c" stroke="#17191C" stroke-width="2.5"/>
    <!-- Trigger -->
    <path d="M25 32 L22 36 L25 40 Z" fill="#EF3124"/>
    <!-- Auxiliary handle -->
    <rect x="60" y="38" width="6" height="18" rx="2" fill="#22262c" stroke="#17191C" stroke-width="2"/>
  </g>
</svg>
