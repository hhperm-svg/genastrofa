<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgAqua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="url(#bgAqua)" filter="url(#shadowA)"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-dasharray="4 3"/>
  <!-- Water Splash / Waves -->
  <path d="M16 86 C30 76 42 94 56 82 C70 70 82 92 98 80 C106 88 108 94 104 102 C85 110 35 110 16 86 Z" fill="#48cae4" opacity="0.8"/>
  <path d="M12 92 C28 84 44 98 62 88 C78 78 94 96 108 88 C104 106 70 114 12 92 Z" fill="#ade8f4"/>
  <!-- Water drops -->
  <circle cx="34" cy="40" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="88" cy="42" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="24" cy="56" r="2.5" fill="#ade8f4"/>
  <circle cx="98" cy="60" r="3.5" fill="#ade8f4"/>
  <!-- Rubber Duck Body -->
  <g transform="translate(30, 32)">
    <!-- Body -->
    <path d="M14 36 C10 48 30 54 44 50 C56 46 62 36 54 28 C46 22 42 26 34 26 C24 26 18 28 14 36 Z" fill="#ffd100" stroke="#17191C" stroke-width="2.5"/>
    <!-- Wing -->
    <path d="M26 34 C24 40 34 44 40 38 C42 34 38 32 30 32 Z" fill="#ffb703" stroke="#17191C" stroke-width="2"/>
    <!-- Head -->
    <circle cx="42" cy="22" r="14" fill="#ffd100" stroke="#17191C" stroke-width="2.5"/>
    <!-- Beak -->
    <path d="M52 20 C60 18 64 24 53 27 Z" fill="#fb8500" stroke="#17191C" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="44" cy="18" r="2.5" fill="#17191C"/>
    <circle cx="45" cy="17" r="1" fill="#ffffff"/>
    <!-- Orange Construction Helmet on Duck -->
    <path d="M30 15 C30 5 54 5 54 15 Z" fill="#f77f00" stroke="#17191C" stroke-width="2.5"/>
    <!-- Helmet Brim -->
    <path d="M26 15 L58 15" stroke="#17191C" stroke-width="3" stroke-linecap="round"/>
    <!-- Headlamp -->
    <rect x="50" y="8" width="5" height="4" rx="1" fill="#17191C"/>
    <circle cx="53" cy="10" r="2" fill="#ffff3f"/>
  </g>
</svg>
